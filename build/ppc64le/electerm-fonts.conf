<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fallback fontconfig configuration, ppc64le builds only.

  build/bin/build-linux-ppc64le.sh copies this next to app.asar, and
  lib/font-conf-fix.js (also from build/ppc64le) points FONTCONFIG_FILE here,
  and only when the renderer could not resolve a single font with the system
  configuration. Nothing in the normal source tree refers to this file.

  Why that can happen: Electron statically links a fontconfig of its own, which
  indexes fonts through the Rust "Fontations" backend instead of FreeType, so it
  can end up with zero font families while the system fontconfig is perfectly
  healthy (fc-list | wc -l lists thousands of fonts, fc-match sans resolves to a
  real file). Chromium treats "no font at all" as fatal, so the renderer aborts
  with SIGTRAP (exit code 133) on the first glyph it needs. Confirmed on
  openSUSE ppc64le (discussion #4529), where a file of this shape fixed it.

  Two things in here matter, and they are the reason this is a separate file
  rather than a patch of the system one:

    * an explicit <dir> list, so nothing depends on the system fonts.conf being
      readable or parseable by the bundled fontconfig, and
    * a private <cachedir>, so a stale or foreign cache file cannot make the
      bundled fontconfig believe a directory holds no font at all. Cache file
      names encode both the fontconfig version and the arch tag (ours looks for
      *-le64.cache-11 and shares /var/cache/fontconfig with whatever else is
      installed), which is exactly how such a cache gets reused by mistake.

  /etc/fonts/conf.d stays included: it only holds aliases (sans-serif to real
  families, metric compatibility, hinting, sub-pixel), it is not what breaks,
  and without it the generic families would resolve to an arbitrary font. If it
  ever does turn out to break something, the web font fallback in font-check.js
  still catches the result.

  (XML comments may not contain a double hyphen, and fontconfig rejects the
  whole file if one shows up. Keep them out of here.)
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>

  <include ignore_missing="yes">/etc/fonts/conf.d</include>

  <cachedir prefix="xdg">electerm/fontconfig</cachedir>
</fontconfig>
