name: publish-to-npm
on:
  release:
    types: [published]
  push:
    branches: [ test-npm ]
# id-token: write is REQUIRED for npm trusted publishing (OIDC) to work
permissions:
  id-token: write
jobs:
  release-npm:
    runs-on: ubuntu-latest
    environment: build
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip npm]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node and npm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/

      - run: cp -r ./build/npm ./
      - run: node build/bin/prepublish.js
      - run: npm config set legacy-peer-deps true && npm i -D shelljs
      # Trusted publishing: do NOT pass a token. npm authenticates via the
      # GitHub OIDC token. Clear NODE_AUTH_TOKEN so no legacy token is used.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ""