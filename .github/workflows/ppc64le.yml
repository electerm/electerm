# Build electerm for ppc64le (PowerPC 64-bit little endian) Linux
#
# Uses the prebuilt ppc64le Electron runtime published by IBM:
#   https://github.com/lex-ibm/electron-ppc64le-build-scripts
#   v41.0.3 is built on Ubuntu 22.04 (glibc 2.35).
#
# Therefore this workflow runs on an ubuntu-22.04 (x64) runner so the
# cross-compiled native modules share the same glibc baseline (2.35) as
# electron. The produced build targets Ubuntu 22.04+ / Debian 12+ / RHEL 9+.
#
# This workflow:
# 1. Cross-compiles native modules for ppc64le: node-pty (mandatory) and
#    @serialport/bindings-cpp (best-effort -- if it does not build it is simply
#    dropped from the package and the app reports no serial ports)
# 2. Builds the x64 app to get the arch-independent app.asar
# 3. Downloads electron v41.0.3 for ppc64le
# 4. Merges asar + ppc64le electron + native modules
# 5. Uploads tar.gz + deb to the GitHub release draft
# 6. Uploads to R2 (add [r2] to the commit message). Like the other builds, the
#    upload happens inside the build script via the shared uploadToR2 helper,
#    so this workflow only installs @aws-sdk/client-s3 and passes CF_R2_* in.
#
# Add [skip ppc64le] to the commit message to skip this workflow.

name: linux-ppc64le

on:
  push:
    branches: [ build, test, build-only, ppc64le ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    environment: build
    if: ${{ !contains(github.event.head_commit.message, '[skip build]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip linux]') && !contains(github.event.head_commit.message, '[skip ppc64le]') }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install ppc64le cross-compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu binutils-powerpc64le-linux-gnu \
          || sudo apt-get install -y crossbuild-essential-ppc64el
        powerpc64le-linux-gnu-g++ --version

    - run: rm -f package-lock.json
    - run: npm config set legacy-peer-deps true

    # Must run BEFORE `npm i`, so that node_modules gets electron 41.0.3.
    # electron-builder/@electron/rebuild resolve the version from the installed
    # electron, not from the temporary edit the build script makes later.
    - name: Update electron version to v41.0.3
      run: |
        node -e "
        const fs = require('fs');
        const pkg = JSON.parse(fs.readFileSync('package.json'));
        pkg.devDependencies.electron = '41.0.3';
        fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
        console.log('Electron version set to 41.0.3');
        "

    - name: Install dependencies
      run: |
        npm install -g yarn
        npm i

    - name: Install R2 dependencies if needed
      if: ${{ contains(github.event.head_commit.message, '[r2]') }}
      run: npm i -D @aws-sdk/client-s3

    - name: Build ppc64le
      env:
        WORKFLOW_NAME: linux-ppc64le
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUILD_NUMBER: ${{ secrets.BUILD_NUMBER }}
        CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
        CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
        CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
        CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      run: bash build/bin/build-linux-ppc64le.sh

    - name: Verify output
      run: |
        ls -la dist-ppc64le/*.tar.gz dist-ppc64le/*.deb
        file dist-ppc64le/electerm-*/electerm
        echo "=== native modules: every .node must be ppc64le ==="
        for f in $(find dist-ppc64le/electerm-* -name "*.node" -type f); do
          echo "--- $f ---"
          readelf -h "$f" | grep -E "Class|Machine|Data"
          readelf -h "$f" | grep -q PowerPC64 || { echo "ERROR: $f is not ppc64le"; exit 1; }
        done
        echo "=== required: node-pty (the terminal) ==="
        find dist-ppc64le/electerm-* -name "pty.node" -type f | grep -q . \
          || { echo "ERROR: pty.node missing"; exit 1; }
        echo "ok: pty.node"
        echo "=== optional: serialport (best-effort, may be absent on ppc64le) ==="
        if find dist-ppc64le/electerm-* -path "*@serialport*" -name "*.node" -type f | grep -q .; then
          echo "ok: serialport binding present and ppc64le"
        else
          echo "note: no serialport binding in this package; serial port feature unavailable"
        fi
