# Build electerm for ppc64le (PowerPC 64-bit little endian) Linux
#
# Uses the prebuilt ppc64le Electron runtime published by IBM:
#   https://github.com/lex-ibm/electron-ppc64le-build-scripts
#   v39.2.7 is built on Ubuntu 22.04 (glibc 2.35).
#
# Therefore this workflow runs on an ubuntu-22.04 (x64) runner so the
# cross-compiled native modules share the same glibc baseline (2.35) as
# electron. The produced build targets Ubuntu 22.04+ / Debian 12+ / RHEL 9+.
#
# This workflow:
# 1. Cross-compiles native modules (node-pty, @serialport/bindings-cpp) for ppc64le
# 2. Builds the x64 app to get the arch-independent app.asar
# 3. Downloads electron v39.2.7 for ppc64le
# 4. Merges asar + ppc64le electron + native modules
# 5. Uploads tar.gz + deb to the GitHub release draft
# 6. Optionally uploads to R2 (add [r2] to the commit message)
#
# Add [skip ppc64le] to the commit message to skip this workflow.

name: linux-ppc64le

on:
  push:
    branches: [ build, test, build-only, ppc64le ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    environment: build
    if: ${{ !contains(github.event.head_commit.message, '[skip build]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip linux]') && !contains(github.event.head_commit.message, '[skip ppc64le]') }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install ppc64le cross-compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu binutils-powerpc64le-linux-gnu \
          || sudo apt-get install -y crossbuild-essential-ppc64el
        powerpc64le-linux-gnu-g++ --version

    - run: rm -f package-lock.json
    - run: npm config set legacy-peer-deps true

    - name: Install dependencies
      run: |
        npm install -g yarn
        npm i

    - name: Build ppc64le
      env:
        WORKFLOW_NAME: linux-ppc64le
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUILD_NUMBER: ${{ secrets.BUILD_NUMBER }}
      run: bash build/bin/build-linux-ppc64le.sh

    - name: Verify output
      run: |
        ls -la dist-ppc64le/*.tar.gz dist-ppc64le/*.deb
        file dist-ppc64le/electerm-*/electerm
        echo "=== native modules ==="
        find dist-ppc64le/electerm-* -name "*.node" -exec sh -c 'echo "--- $1 ---"; file "$1"; readelf -h "$1" 2>/dev/null | grep -E "Machine|Class"' _ {} \;

    - name: Upload to R2
      if: ${{ contains(github.event.head_commit.message, '[r2]') }}
      env:
        CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
      run: |
        mkdir -p ~/.aws
        cat > ~/.aws/credentials << EOF
        [default]
        aws_access_key_id = ${{ secrets.CF_R2_ACCESS_KEY_ID }}
        aws_secret_access_key = ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        EOF
        cat > ~/.aws/config << EOF
        [default]
        region = auto
        endpoint_url = ${{ secrets.CF_R2_ENDPOINT }}
        EOF
        for file in $(find dist-ppc64le \( -name "*.tar.gz" -o -name "*.deb" \) -type f); do
          filename=$(basename "$file")
          aws s3 cp "$file" "s3://${CF_R2_BUCKET}/${filename}" \
            --acl public-read \
            --cache-control "max-age=31536000"
          echo "Uploaded: ${filename}"
        done
