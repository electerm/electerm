# Consolidated mac e2e test workflow.
#
# Strategy:
#   1. `build` runs once: install deps (cached), full build (`npm run b`),
#      `npm run pb`, and the node:test unit suite. It then uploads the built
#      `work/` directory as an artifact. This removes the repeated full build
#      + install that each of the old mac-test-1/2/3 jobs paid for.
#   2. `test` is a matrix that restores the cached node_modules, downloads the
#      built app, and runs a Playwright `--shard` of the e2e suite. Shards are
#      auto-balanced by test count, so there is no need to hand-assign files by
#      prefix anymore.
#
# Tuning:
#   - To change parallelism, edit the `matrix.include` list and keep the
#     `--shard=${{ matrix.shard }}/N` denominator in sync with the entry count.
#   - Each shard gets its own dedicated SSH test account (user 1..6), so no two
#     shards ever share an account. This removes any cross-test interference
#     and is a clean 1:1 shard-to-account mapping. To add more parallelism,
#     provision more accounts and extend `matrix.include` (keep the
#     `--shard=${{ matrix.shard }}/6` denominator in sync with the entry count).
#   - The dedicated `test1` / `test3` branches still run only that account's
#     shards (quick single-group run), exactly like before.

name: mac-x64-test

on:
  push:
    branches: [ build, test, tester, test1, test3 ]

jobs:
  build:
    runs-on: macos-15-intel
    environment: build
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip mac]') }}
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install setuptools
    - name: Cache node_modules
      id: nm-cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: nm-${{ hashFiles('package-lock.json') }}
    - run: npm config set legacy-peer-deps true
    - run: npm install -g yarn
    - run: npm i
      if: ${{ steps.nm-cache.outputs.cache-hit != 'true' }}
    - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i -D -E playwright@1.49.1 && npm i -D -E @playwright/test@1.49.1

    # script:
    - run: npm run b

    - name: Run pb
      run: npm run pb

    - name: Run unit tests (node:test)
      run: npm run test-unit-ci
      env:
        NODE_TEST: 1

    - name: Save node_modules cache
      if: ${{ steps.nm-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: node_modules
        key: nm-${{ hashFiles('package-lock.json') }}

    - name: Upload built app
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: work
        if-no-files-found: error

  test:
    needs: build
    runs-on: macos-15-intel
    environment: build
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip mac]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, user: 1 }
          - { shard: 2, user: 2 }
          - { shard: 3, user: 3 }
          - { shard: 4, user: 4 }
          - { shard: 5, user: 5 }
          - { shard: 6, user: 6 }
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
    - name: Restore node_modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: nm-${{ hashFiles('package-lock.json') }}
    - name: Download built app
      uses: actions/download-artifact@v4
      with:
        name: app-build
        path: work
    - name: test
      if: ${{ !contains(github.event.head_commit.message, format('[skip test{0}]', matrix.user)) && (matrix.user == 1 || !contains(github.ref, '/test1')) && (matrix.user == 3 || !contains(github.ref, '/test3')) }}
      uses: GabrielBB/xvfb-action@v1
      with:
        run: ./node_modules/.bin/playwright test test/e2e --workers=1 --shard=${{ matrix.shard }}/6
      env:
        NODE_TEST: 1
        TEST_HOST: ${{ secrets.TEST_HOST }}
        TEST_USER: ${{ matrix.user == 1 && secrets.TEST_USER_1 || matrix.user == 2 && secrets.TEST_USER_2 || matrix.user == 3 && secrets.TEST_USER_3 || matrix.user == 4 && secrets.TEST_USER_4 || matrix.user == 5 && secrets.TEST_USER_5 || matrix.user == 6 && secrets.TEST_USER_6 }}
        TEST_PASS: ${{ matrix.user == 1 && secrets.TEST_PASS_1 || matrix.user == 2 && secrets.TEST_PASS_2 || matrix.user == 3 && secrets.TEST_PASS_3 || matrix.user == 4 && secrets.TEST_PASS_4 || matrix.user == 5 && secrets.TEST_PASS_5 || matrix.user == 6 && secrets.TEST_PASS_6 }}
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
        GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        GITEE_ID: ${{ secrets.GITEE_ID }}
        CUSTOM_SYNC_URL: ${{ secrets.CUSTOM_SYNC_URL }}
        CUSTOM_SYNC_USER: ${{ secrets.CUSTOM_SYNC_USER }}
        CUSTOM_SYNC_SECRET: ${{ secrets.CUSTOM_SYNC_SECRET }}
        CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
