name: sync-release-to-atomgit

# Mirror the latest GitHub release (tag + notes + all binary assets) to
# https://atomgit.com/electerm/electerm, same idea as upload-release-assets-r2.yml.
#
# NOTE: the atomgit repo used to be a *mirror repository* (镜像仓库) of this GitHub
# repo. That mirror was removed on 2026-10-02, which is what unblocked git push:
# while it existed every push was rejected with
#   403 <CH.00905403> This operation is not allowed because the repository is an
#   image repository.
# Nothing arrives on atomgit by itself any more -- no tags, no branches -- so we
# push the release tag ourselves (which carries the commits it points at) and only
# then create the release + attachments over the REST API. Branch mirroring is
# deliberately not replaced: atomgit now tracks released tags only.
#
# atomgit release attachments: single file <= 2GB, no documented total quota
# (the 2GB git / 5GB LFS limits only apply to code storage, not attachments).
# A full electerm release is ~4.4GB, so by default we keep only the newest
# release on atomgit -- set keep_previous=true if you ever want them to pile up.
#
# What the atomgit API can and cannot do (probed 2026-09-28):
#   DELETE /releases/:tag                      -> 405 Method Not Allowed
#   DELETE /releases/:tag/attach_files/:id     -> works, but only for assets
#     whose JSON has an "id"; the 4 auto generated source archives (type
#     "source") have none, so they cannot be removed and stay on every release.
#   GET /releases                              -> only releases we created, the
#     mirror does not auto create them (it only mirrors branches/tags).
# So "keep only the newest" means: empty the old releases, they stay behind as
# empty shells plus their 4 source archives (a few KB). Attachments are the
# only real space, and those we do delete.
on:
  release:
    types: [published]
  push:
    branches: [ atom ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync, e.g. v5.5.35 (default: version in package.json)'
        required: false
        type: string
      keep_previous:
        description: 'Keep previously synced releases on atomgit (default: delete them)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: build
    env:
      OWNER: electerm
      REPO: electerm
      # The git push username is the *account*, not the org. Verified 2026-10-02:
      # `ssh -T git@atomgit.com` answers "Welcome to GitCode, zxdong262".
      ATOMGIT_USER: zxdong262
      # The attachment PUT goes to file.gitcode.com, which resolves to a
      # mainland-China Huawei OBS gateway (116.205.2.91). From a GitHub runner
      # that route crawls: measured 41 KB/s, and HTTP/2 makes it worse -- a 20MB
      # PUT timed out after 300s having sent ~10MB. 4.4GB at that rate is ~35h.
      # This Huawei Cloud IP serves the same OBS backend (the presigned URL and
      # its callback work unchanged) and measured 8 MB/s for the same payload:
      #   default dns + http2   41 KB/s
      #   default dns + http1.1  6.1 MB/s
      #   this ip               8.1 MB/s
      # It is only used as --resolve (Host/SNI stay file.gitcode.com); if it
      # ever goes away the connect fails and we fall back to plain DNS.
      UPLOAD_IP: 159.138.147.37
    steps:
      # fetch-depth 0 is required, not a preference: a tag push from the default
      # depth-1 clone is rejected with
      #   ! [remote rejected] ... (shallow update not allowed)
      # verified 2026-10-02 against the real repo. Full history is only ~20MB /
      # ~10s here, so there is nothing to optimise.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${INPUT_TAG:-$RELEASE_TAG}"
          if [ -z "$tag" ]; then
            tag="v$(node -p "require('./package.json').version")"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "syncing $tag"

      # Nothing arrives on atomgit on its own any more, so we push the release tag
      # ourselves. Pushing a tag also carries the commits it points at, so the tag
      # and the code land together in one step.
      #
      # Order matters twice over:
      #  - before Create release, because POST /releases without a target_commitish
      #    asks atomgit to create the tag itself, and that is exactly what used to
      #    answer 400 "this operation is not allowed because the repository is an
      #    image repository" back when this was a mirror repo.
      #  - before Download release assets, so a failure here costs seconds instead
      #    of pulling ~4.4GB first.
      #
      # Verified by hand 2026-10-02: a throwaway tag pushed to this repo over SSH
      # as the zxdong262 account succeeded, and the push immediately made the
      # commits the old mirror had been missing readable through the API.
      - name: Push tag to atomgit
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -eu
          # Keep the token out of the URL: git prints the URL on failure, and a
          # credential helper is the supported way to feed it in anyway.
          cred="$(mktemp)"
          printf '#!/bin/sh\necho "username=%s"\necho "password=%s"\n' \
            "$ATOMGIT_USER" "$ATOMGIT_TOKEN" > "$cred"
          chmod +x "$cred"
          trap 'rm -f "$cred"' EXIT

          url="https://atomgit.com/${OWNER}/${REPO}.git"
          echo "pushing ${TAG} to atomgit ..."
          # --force: a re-run finds the tag already there, and a re-cut release
          # must be able to move it.
          if ! git -c credential.helper="$cred" push --force "$url" \
                 "refs/tags/${TAG}:refs/tags/${TAG}"; then
            echo "::error::could not push ${TAG} to atomgit over HTTPS with ATOMGIT_TOKEN"
            echo "If that token has no code-push scope, add the account SSH key as an"
            echo "ATOMGIT_SSH_KEY secret and point this step at"
            echo "  git@atomgit.com:${OWNER}/${REPO}.git"
            exit 1
          fi

          # The push reported success -- confirm atomgit actually serves the ref
          # back before the release step starts depending on it.
          for i in 1 2 3 4 5; do
            if git ls-remote --tags "$url" "refs/tags/${TAG}" \
                 | grep -q "refs/tags/${TAG}$"; then
              echo "tag ${TAG} is on atomgit"
              exit 0
            fi
            echo "waiting for ${TAG} to become readable (${i}/5)"
            sleep 3
          done
          echo "::error::pushed ${TAG} but atomgit does not serve it back"
          exit 1

      - name: Download release assets from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          mkdir -p ./release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir ./release-assets
          echo "--- assets ---"
          find ./release-assets -type f -exec ls -l {} + \
            | awk '{printf "%12s  %s\n", $5, $9; t += $5}
                   END {printf "total: %.2f GB\n", t / 1073741824}'

      # Re-run safety: drop whatever a previous attempt left on this tag, so
      # asset names stay unique and the asset count check below stays exact.
      - name: Reset attachments on the sync tag
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -u
          api="https://api.atomgit.com/api/v5/repos/${OWNER}/${REPO}"
          auth="access_token=${ATOMGIT_TOKEN}"
          curl -sS "${api}/releases/${TAG}?${auth}" \
            | jq -r '(.assets // [])[] | select(.type == "attach") | "\(.id) \(.name)"' \
            | while read -r id name; do
            [ -n "$id" ] && [ "$id" != "null" ] || continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              "${api}/releases/${TAG}/attach_files/${id}?${auth}" || echo 000)"
            echo "  rm stale attachment $name ($id) -> $code"
          done

      - name: Create release on atomgit
        env:
          GH_TOKEN: ${{ github.token }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -u
          api="https://api.atomgit.com/api/v5/repos/${OWNER}/${REPO}"
          auth="access_token=${ATOMGIT_TOKEN}"

          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
          jq -n --arg tag "$TAG" --arg body "$body" \
            '{tag_name: $tag, name: $tag, body: $body}' > /tmp/release.json

          code="$(curl -sS -o /tmp/release.out -w '%{http_code}' -X POST \
            "${api}/releases?${auth}" \
            -H 'Content-Type: application/json' \
            -d @/tmp/release.json || echo 000)"
          echo "create release -> $code"
          cat /tmp/release.out || true
          # 200/201 = created, 405/409 = already there (re-run). Anything else is
          # fatal: without the release object every upload_url call returns 404,
          # and carrying on only discovers that one file at a time. A 400
          # "image repository" here means the tag is missing on the mirror (see
          # the step above).
          case "$code" in
            200|201) echo "created" ;;
            405|409) echo "release already exists, reusing it" ;;
            *)
              echo "::error::cannot create release ${TAG} on atomgit (HTTP ${code})"
              exit 1
              ;;
          esac

      - name: Upload assets to atomgit
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          UPLOAD_JOBS: '4'
        run: |
          set -u
          api="https://api.atomgit.com/api/v5/repos/${OWNER}/${REPO}"
          auth="access_token=${ATOMGIT_TOKEN}"
          # set by upload_one when the release itself is missing, which no
          # amount of retrying can fix
          HARD_FAIL=/tmp/atomgit-upload-hard-fail
          rm -f "$HARD_FAIL"
          export api auth TAG UPLOAD_IP HARD_FAIL

          upload_one() {
            file="$1"
            name="$(basename "$file")"
            size="$(wc -c < "$file" | tr -d ' ')"
            # budget the transfer at ~1MB/s: anything slower is a bad route, let
            # --max-time kill it so the next attempt can try a different one.
            # (curl's --speed-limit only applies to downloads, so we cannot use it)
            budget=$((size / 1000000 + 30))
            [ "$budget" -gt 1500 ] && budget=1500

            attempt=1
            while [ "$attempt" -le 4 ]; do
              # Keep the status code so a 404 (no such release) can be told
              # apart from a transient failure. A 404 is permanent -- retrying
              # only repeats the same answer, and 51 files x 4 attempts x 3
              # rounds is ~25 minutes of guaranteed-nothing.
              uu="$(mktemp)"
              code="$(curl -sS -o "$uu" -w '%{http_code}' \
                "${api}/releases/${TAG}/upload_url?${auth}&file_name=${name}" \
                || echo 000)"
              if [ "$code" = "404" ]; then
                rm -f "$uu"
                echo "::error::release ${TAG} does not exist on atomgit (upload_url -> 404)"
                : > "$HARD_FAIL"
                return 1
              fi
              if [ "$code" != "200" ]; then
                rm -f "$uu"
                echo "::warning::no upload url for ${name} (attempt ${attempt}, HTTP ${code})"
                sleep 10
                attempt=$((attempt + 1))
                continue
              fi
              info="$(cat "$uu")"
              rm -f "$uu"
              url="$(printf '%s' "$info" | jq -r '.url')"
              host="$(printf '%s' "$url" | sed -E 's#^https?://([^/]+).*#\1#')"
              hdr="$(mktemp)"
              printf '%s' "$info" \
                | jq -r '.headers | to_entries[] | "header = \"\(.key): \(.value)\""' > "$hdr"

              case "$attempt" in
                1|3) set -- --resolve "${host}:443:${UPLOAD_IP}" --http1.1 ;;
                2)   set -- --http1.1 ;;
                *)   set -- ;;
              esac
              echo "start ${name} (${size}B, budget ${budget}s), attempt ${attempt}"

              if curl -sSf -X PUT "$url" -K "$hdr" \
                  --data-binary "@${file}" \
                  -H 'Expect:' \
                  --connect-timeout 20 \
                  --max-time "$budget" \
                  "$@" \
                  -w '  -> %{http_code} in %{time_total}s (%{speed_upload} B/s)\n'; then
                rm -f "$hdr"
                echo "ok   ${name}"
                return 0
              fi
              rm -f "$hdr"
              echo "::warning::upload failed/slow for ${name} (attempt ${attempt}), next route"
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "::error::giving up on ${name}"
            return 1
          }
          export -f upload_one

          # skip the auto generated source archives, smallest first so the
          # attachment list starts filling immediately and a bad route shows up
          # early instead of after the big images
          local_files() {
            find ./release-assets -type f \
              ! -name "${TAG}.tar.gz" \
              ! -name "${TAG}.zip" \
              -exec ls -l {} + \
              | sort -k5 -n | awk '{print $NF}'
          }
          # names atomgit already has; only type=attach counts -- the 4 "source"
          # entries are generated by atomgit itself and are not our files
          remote_names() {
            curl -sS "${api}/releases/${TAG}?${auth}" \
              | jq -r '(.assets // [])[] | select(.type == "attach") | .name'
          }

          # The PUT can return 200 from the OBS gateway while the attachment is
          # never registered (seen on the two ~95MB legacy AppImages: 51 PUTs
          # returned 200, only 49 attachments appeared, one id 220147 was even
          # consumed and dropped). So loop until every local file shows up.
          round=1
          while [ "$round" -le 3 ]; do
            remote_names > /tmp/remote.txt || true
            local_files | while read -r f; do
              base="$(basename "$f")"
              grep -qxF "$base" /tmp/remote.txt || echo "$f"
            done > /tmp/todo.txt
            todo="$(grep -c . /tmp/todo.txt || true)"
            if [ "$todo" -eq 0 ]; then
              echo "--- all files registered after round $((round - 1))"
              break
            fi
            echo "--- round ${round}: ${todo} file(s) to upload"
            xargs -r -P "${UPLOAD_JOBS}" -I {} bash -c 'upload_one "$@"' _ {} \
              < /tmp/todo.txt || echo "::warning::some uploads failed in round ${round}"
            # a soft failure (one flaky PUT) deserves another round; a missing
            # release does not
            if [ -e "$HARD_FAIL" ]; then
              echo "::error::aborting: release ${TAG} is missing on atomgit"
              exit 1
            fi
            round=$((round + 1))
          done
          echo "--- attach assets on atomgit now: $(remote_names | grep -c . || true)"

      - name: Verify
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          api="https://api.atomgit.com/api/v5/repos/${OWNER}/${REPO}"
          res="$(curl -sS "${api}/releases/${TAG}?access_token=${ATOMGIT_TOKEN}&temp_download_url=true")"
          echo "$res" | jq -r '(.assets // [])[] | select(.type == "attach") | "\(.name) -> \(.browser_download_url)"'
          have="$(echo "$res" | jq -r '(.assets // [])[] | select(.type == "attach") | .name' | sort)"
          n="$(printf '%s\n' "$have" | grep -c . || true)"

          # compare by name, not by count: atomgit adds 4 "source" archives the
          # github release never had, so a plain count never matches
          want="$(find ./release-assets -type f \
            ! -name "${TAG}.tar.gz" ! -name "${TAG}.zip" \
            -exec basename {} \; | sort)"
          w="$(printf '%s\n' "$want" | grep -c . || true)"
          missing="$(comm -23 <(printf '%s\n' "$want") <(printf '%s\n' "$have"))"

          echo "atomgit attach assets: $n / github assets: $w"
          echo "+4 mirror generated source archives: $(echo "$res" | jq '[.assets // [] | .[] | select(.type == "source")] | length')"
          echo "https://atomgit.com/${OWNER}/${REPO}/releases"
          if [ -n "$missing" ]; then
            echo "::error::missing on atomgit:"
            printf '%s\n' "$missing"
            exit 1
          fi
          echo "all $(printf '%s' "$w") assets verified on atomgit"

      # Drop every release except the one we just synced, so we never stack
      # 4.4GB per version.
      #
      # This MUST run after Verify. It used to run before the upload, and on
      # 2026-10-01 that cost real data: v5.5.35 was emptied from 51 attachments
      # (4.37GB) down to 6 (0.66GB), then nothing was uploaded, because the
      # v5.5.56 release could not be created. atomgit ended up emptier than it
      # was before the run. Only ever destroy the old copy once the new one is
      # confirmed good.
      #
      # Note a DELETE returning 500 means it did NOT take -- only 204 is a real
      # delete, which is why those 6 files survived.
      - name: Clean previously synced releases
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.keep_previous }}
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -u
          api="https://api.atomgit.com/api/v5/repos/${OWNER}/${REPO}"
          auth="access_token=${ATOMGIT_TOKEN}"

          curl -sS "${api}/releases?${auth}&per_page=100" \
            | jq -r '.[].tag_name' | while read -r old; do
            [ -n "$old" ] || continue
            [ "$old" = "$TAG" ] && continue
            echo "--- cleaning $old"
            # only type=attach has an id; the mirror's source archives have none
            # and are skipped by jq (their id is null -> DELETE would 400)
            curl -sS "${api}/releases/${old}?${auth}" \
              | jq -r '(.assets // [])[] | select(.type == "attach") | "\(.id) \(.name)"' \
              | while read -r id name; do
              [ -n "$id" ] && [ "$id" != "null" ] || continue
              code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                "${api}/releases/${old}/attach_files/${id}?${auth}" || echo 000)"
              echo "  rm attachment $name ($id) -> $code"
            done
            # DELETE /releases/:tag is 405 Method Not Allowed -- the release
            # object itself cannot be removed, only emptied
            echo "  (release $old kept, its attachments are gone)"
          done
