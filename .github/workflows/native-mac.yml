name: Native Mac (Apple Silicon)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test and package arm64 app
        run: |
          for developer in /Applications/Xcode_26*.app/Contents/Developer; do
            if [ -d "$developer" ]; then export DEVELOPER_DIR="$developer"; break; fi
          done
          swift --version
          set -o pipefail
          sh build-mac.sh 2>&1 | tee "$RUNNER_TEMP/native-build.log"
      - name: Annotate build or test failures
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/native-build.log" ]]; then
            awk '/error:|fatal:|Expectation failed|recorded an issue|Test .* failed|Fatal error|Signal [0-9]/ {
              gsub(/%/, "%25"); print "::error::" $0
              if (++count == 20) exit
            }' "$RUNNER_TEMP/native-build.log"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Electerm-Terminal-mac-arm64
          path: dist/Electerm-Terminal-mac-arm64.zip
          if-no-files-found: error
