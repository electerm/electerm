name: atomgit-probe

# TEMPORARY diagnostic workflow -- delete this file and the atom-probe branch
# once the upload throughput question is answered.
on:
  push:
    branches: [ atom-probe ]

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: build
    env:
      OWNER: electerm
      REPO: electerm
      TAG: v5.5.35
    steps:
      - name: Probe atomgit upload endpoint
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          set -u
          api="https://api.atomgit.com/api/v5/repos/${OWNER}/${REPO}"
          auth="access_token=${ATOMGIT_TOKEN}"

          info="$(curl -sSf "${api}/releases/${TAG}/upload_url?${auth}&file_name=probe-small.bin")"
          echo "--- upload_url response (headers redacted) ---"
          echo "$info" | jq '{url: .url, header_keys: (.headers | keys)}'
          url="$(echo "$info" | jq -r '.url')"
          host="$(echo "$url" | sed -E 's#^https?://([^/]+).*#\1#')"
          echo "upload host: ${host}"
          echo "--- dns ---"
          getent ahostsv4 "$host" | head -5 || true
          for ip in 159.138.147.37; do
            echo -n "connect to ${ip}:443 -> "
            curl -sS -o /dev/null -m 20 -w 'connect=%{time_connect}s tls=%{time_appconnect}s code=%{http_code}\n' \
              "https://${ip}/" -k --resolve "${host}:443:${ip}" || echo "failed"
          done

          hdr="$(mktemp)"
          echo "$info" | jq -r '.headers | to_entries[] | "header = \"\(.key): \(.value)\""' > "$hdr"
          echo "--- headers sent ---"
          cat "$hdr"

          for mb in 1 20; do
            head -c $((mb * 1048576)) /dev/urandom > /tmp/probe.bin
            echo "--- PUT ${mb}MB ---"
            curl -sS -X PUT "$url" -K "$hdr" --data-binary @/tmp/probe.bin \
              -H 'Expect:' --connect-timeout 30 --max-time 300 \
              -w 'code=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s up=%{speed_upload}B/s\n' \
              || echo "curl exit $?"
          done

          echo "--- assets on atomgit now ---"
          curl -sS "${api}/releases/${TAG}?${auth}" | jq -r '.assets[]? | "\(.id) \(.name)"'

          echo "--- cleanup probe attachment ---"
          for id in $(curl -sS "${api}/releases/${TAG}?${auth}" \
                        | jq -r '.assets[]? | select(.name=="probe-small.bin") | .id'); do
            curl -sS -o /dev/null -w "delete ${id} -> %{http_code}\n" -X DELETE \
              "${api}/releases/${TAG}/attach_files/${id}?${auth}"
          done
