name: atomgit-probe3

# TEMPORARY diagnostic -- confirm sustained throughput for the real config.
on:
  push:
    branches: [ atom-probe ]

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: build
    env:
      OWNER: electerm
      REPO: electerm
      TAG: v5.5.35
    steps:
      - name: Sustained upload test
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          set -u
          api="https://api.atomgit.com/api/v5/repos/${OWNER}/${REPO}"
          auth="access_token=${ATOMGIT_TOKEN}"

          info="$(curl -sSf "${api}/releases/${TAG}/upload_url?${auth}&file_name=probe-big.bin")"
          host="$(echo "$info" | jq -r '.url' | sed -E 's#^https?://([^/]+).*#\1#')"
          echo "host=${host}"
          getent ahostsv4 "$host" | head -3

          head -c $((32 * 1048576)) /dev/urandom > /tmp/p.bin
          echo "payload: $(wc -c < /tmp/p.bin) bytes"

          i=0
          try() {
            label="$1"; shift
            i=$((i + 1))
            echo "=== ${label} ==="
            fresh="$(curl -sSf "${api}/releases/${TAG}/upload_url?${auth}&file_name=probe-big-${i}.bin")"
            url="$(echo "$fresh" | jq -r '.url')"
            hdr="$(mktemp)"
            echo "$fresh" | jq -r '.headers | to_entries[] | "header = \"\(.key): \(.value)\""' > "$hdr"
            curl -sS -X PUT "$url" -K "$hdr" --data-binary @/tmp/p.bin \
              -H 'Expect:' \
              --connect-timeout 20 --max-time 180 \
              -w 'code=%{http_code} total=%{time_total}s up=%{speed_upload}B/s\n' \
              "$@" || echo "curl exit $?"
            rm -f "$hdr"
          }

          try "A: alt ip"           --resolve "${host}:443:159.138.147.37"
          try "B: alt ip + http1.1" --resolve "${host}:443:159.138.147.37" --http1.1
          try "C: alt ip (repeat)"  --resolve "${host}:443:159.138.147.37"
          try "D: default dns+h1.1" --http1.1

          echo "=== cleanup ==="
          for id in $(curl -sS "${api}/releases/${TAG}?${auth}" \
                        | jq -r '.assets[]? | select(.name | startswith("probe-big")) | .id'); do
            curl -sS -o /dev/null -w "delete ${id} -> %{http_code}\n" -X DELETE \
              "${api}/releases/${TAG}/attach_files/${id}?${auth}"
          done
