name: electerm-react-publish
on:
  release:
    types: [published]
  push:
    branches: [ electerm-react ]
# id-token: write is REQUIRED for npm trusted publishing (OIDC) to work
permissions:
  id-token: write
jobs:
  release-npm:
    runs-on: ubuntu-24.04
    environment: build
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip npm]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node and npm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # no registry-url: it writes a .npmrc with
          # _authToken=${NODE_AUTH_TOKEN} and a placeholder token, which makes npm
          # take the token path and skip the OIDC exchange trusted publishing needs
      - run: npm config set legacy-peer-deps true
      - run: npm install shelljs
      - name: build
        run: node src/build/bin/publish-electerm-react.js
