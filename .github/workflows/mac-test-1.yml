# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: mac-x64-test-1

on:
  push:
    branches: [ build, test, test-only, test1, temp/ubuntu-test-ci ]

jobs:
  build:

    runs-on: ubuntu-latest
    environment: build
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip mac]') && !contains(github.event.head_commit.message, '[skip test1]') }}

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    # before_install:
    - run: pip install setuptools
    - run: npm config set legacy-peer-deps true
    - run: npm install -g yarn
    - run: npm i
    - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i -D -E playwright@1.64.1 && npm i -D -E @playwright/test@1.64.1

    # Linux system deps for Playwright's bundled Electron/Chromium (ubuntu-latest)
    - name: Install OS deps for Playwright Electron
      run: sudo "$GITHUB_WORKSPACE/node_modules/.bin/playwright" install-deps chromium

    # script:
    - run: npm run b
    
    - name: Run pb
      run: npm run pb
    # Stand up the ssh/sftp test server on 127.0.0.1: the e2e specs need a real
    # sshd with password auth, and a local one removes the shared external host
    # (and its secrets) from the pipeline. Fresh runner, fresh user, so no
    # cleanup step is needed.
    - name: Start local ssh test server
      run: sudo bash src/build/bin/local-ssh-test-server.sh

    - name: test
      uses: GabrielBB/xvfb-action@v1
      with:
        run: npm run test1
      env:
        NODE_TEST: 1
        TEST_HOST: 127.0.0.1
        TEST_PORT: 2222
        TEST_USER: etest
        TEST_PASS: electerm-test
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
        GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        GITEE_ID: ${{ secrets.GITEE_ID }}

    - name: Upload failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: diag-mac-test-1
        path: test-results/
        if-no-files-found: ignore
