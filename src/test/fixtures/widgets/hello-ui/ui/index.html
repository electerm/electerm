<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <title>Hello UI</title>
  <link rel='stylesheet' href='style.css'>
</head>
<body>
  <h1>Hello UI</h1>
  <p class='sub'>A custom electerm widget: this page runs on electerm-widget://hello-ui/</p>

  <label>Name</label>
  <input id='name' value='world'>

  <div class='row'>
    <button id='greet'>Call greet() in main process</button>
    <button id='upper'>Upper case</button>
    <button id='copy'>Copy result</button>
  </div>

  <pre id='out'>ready</pre>

  <script src='app.js'></script>
</body>
</html>
